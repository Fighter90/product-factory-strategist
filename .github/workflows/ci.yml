name: CI

# PRO-63: тест документации (tests/test_docs_commands.py — каждая команда `pfs` из
# README/HELP/INSTALL/AGENTS, RU и EN, прогоняется в песочнице) и вся сюита.
# Сюита на чистом stdlib — внешних зависимостей и сервисов не нужно.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты (включая автотест документации)
        run: python3 -m unittest discover -s tests
