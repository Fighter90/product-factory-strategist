[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-factory-strategist"
version = "1.2.21"
description = "Стратег Фабрики продуктов — ИИ-агент для руководителя цифрового продукта (CLI pfs)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
pfs = "tools.pfs.cli:main"

[tool.setuptools]
packages = ["tools", "tools.pfs"]
