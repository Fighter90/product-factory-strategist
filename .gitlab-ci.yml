stages:
  - test

test:
  stage: test
  image: python:3.12-slim
  script:
    - python3 -m unittest discover -s tests -v
    - python3 -m tools.pfs doctor
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    when: always
    paths:
      - docs/
    expire_in: 1 week
